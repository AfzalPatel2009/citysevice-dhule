
name: CitySeva APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Create Debug Keystore
        run: |
         mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Debug Keystore
        run: |
          mkdir -p "$HOME/.config/.android"
                - name: Create Debug Keystore
       run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate SHA-1 and SHA-256
        run: |
          gradle --no-daemon --max-workers=2 signingReport
      - name: Build APK
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CitySeva-Dhule-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
